<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>撤机点位登记 · 粤明便利运维部</title>
<style>
:root{--brand:#1d6fb8;--dark:#155488;--bg:#f4f6f9;--card:#fff;--line:#e3e8ef;--text:#1f2933;--muted:#6b7785;--danger:#c0392b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}.wrap{max-width:760px;margin:auto;padding:16px 14px 60px}.top{background:linear-gradient(135deg,var(--brand),var(--dark));color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 4px 14px #1d6fb840}.top h1{margin:0;font-size:20px}.top p{margin:4px 0 0;font-size:13px;opacity:.9}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0}.btn{border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--brand);color:#fff}.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}.soft{background:#eef3f8;color:var(--muted);border:1px solid var(--line)}.section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 8px #1428460f}.section h2{margin:0 0 12px;font-size:16px;color:var(--dark);border-left:4px solid var(--brand);padding-left:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.field{margin-bottom:11px}.field.full{grid-column:1/-1}label{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:15px;font-family:inherit;background:#fbfcfe;color:var(--text);outline:0}input:focus,select:focus,textarea:focus{border-color:var(--brand);background:#fff}textarea{resize:vertical;min-height:70px}.required{color:var(--danger)}.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:#1f2933;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:560px){.grid{grid-template-columns:1fr}}@media print{body{background:#fff;font-size:13px}.toolbar,.toast{display:none}.wrap{max-width:none;padding:0}.section{box-shadow:none;padding:10px 12px;margin-bottom:8px;break-inside:avoid}.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body><main class="wrap"><header class="top"><h1>🗑️ 撤机点位登记</h1><p>设备回收下架 · 粤明便利运维部</p></header><nav class="toolbar"><a class="btn ghost" href="../index.html">返回首页</a><button class="btn primary" type="button" onclick="window.print()">打印 / 保存 PDF</button><button class="btn soft" type="button" onclick="copyForm()">复制表单内容</button><button class="btn soft" type="button" onclick="resetForm()">清空重填</button></nav><form id="form" onsubmit="return false">
<section class="section"><h2>一、撤机任务</h2><div class="grid"><div class="field"><label>登记日期 </label><input type="date" name="登记日期"></div><div class="field"><label>运维人员 </label><input name="运维人员"></div><div class="field"><label>客户 / 门店名称 </label><input name="客户/门店名称"></div><div class="field"><label>联系电话</label><input type="tel" name="联系电话"></div><div class="field full"><label>撤机原因 </label><textarea name="撤机原因" placeholder="如合同到期、门店关闭、设备故障、客户要求等"></textarea></div></div></section>
<section class="section"><h2>二、点位与设备</h2><div class="grid"><div class="field"><label>设备编号（多个可每行填一个）</label><textarea name="设备编号" rows="2" placeholder="每台一行，可填多台"></textarea></div><div class="field"><label>设备型号</label><input name="设备型号"></div><div class="field full"><label>点位地址 </label><input name="点位地址"></div><div class="field"><label>设备外观状态</label><select name="设备外观状态"><option>正常</option><option>轻微损坏</option><option>严重损坏</option><option>无法确认</option></select></div><div class="field"><label>配件回收情况</label><select name="配件回收情况"><option>完整</option><option>部分回收</option><option>未回收</option></select></div><div class="field"><label>设备去向</label><select name="设备去向"><option>返仓</option><option>维修</option><option>转其他点位</option><option>待处理</option></select></div><div class="field"><label>回收数量</label><input type="number" name="回收数量" min="0" value="1"></div></div></section>

</form></main><div class="toast" id="toast"></div><script>
const form=document.getElementById('form');
document.querySelector('input[type=date]').value=new Date().toISOString().slice(0,10);
function message(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function copyForm(){
  const title=document.querySelector('.top h1').textContent.trim();
  const lines=[...new FormData(form)].map(([k,v])=>k+'：'+(v&&String(v).trim()?v:'未填写'));
  const NL=String.fromCharCode(10);
  copyText(title+NL+NL+lines.join(NL));
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>message('表单内容已复制')).catch(()=>fallbackCopy(t));
  }else{fallbackCopy(t);}
}
function fallbackCopy(t){
  const ta=document.createElement('textarea');
  ta.value=t;ta.style.position='fixed';ta.style.top='-9999px';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');message('表单内容已复制');}catch(e){message('复制失败，请手动长按选择');}
  document.body.removeChild(ta);
}
function resetForm(){
  if(confirm('确定清空当前表单吗？')){
    form.reset();
    const d=form.querySelector('input[type=date]');if(d)d.value='';
    message('已清空表单');
  }
}
</script></body></html>
